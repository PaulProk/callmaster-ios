name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen (2.44.0 for Xcode 15.4)
        run: |
          curl -L -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.44.0/xcodegen.zip
          unzip -o -q xcodegen.zip
          echo "$(pwd)/xcodegen/bin" >> $GITHUB_PATH

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project CallMaster.xcodeproj \
            -scheme CallMaster \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/CallMaster.app" Payload/
          zip -qry CallMaster-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallMaster-unsigned-ipa
          path: CallMaster-unsigned.ipa
          retention-days: 30
